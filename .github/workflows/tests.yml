name: Tests

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install plain dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel pytest
          pip install schedule "stomp.py==8.1.2"
          pip install "oslo.config==9.5.0" "oslo.i18n==6.3.0" "eventlet==0.41.0" "webob==1.8.8" "routes==2.5.1" "tinyrpc==1.1.7" "netaddr==1.3.0" "msgpack==1.1.2"

      # ryu (the SDN framework used by the emulator/controller) is an old
      # package whose setup script relies on a setuptools API that was
      # removed in modern setuptools releases, so it must be installed
      # with an older setuptools pinned first.
      - name: Install ryu with a compatible setuptools
        run: |
          pip install "setuptools==58.0.4"
          pip install "ryu==4.34" --no-build-isolation --no-cache-dir

      - name: Patch ryu for compatibility with modern oslo/eventlet
        run: python scripts/patch_ryu.py

      - name: Run tests
        run: pytest tests modules -v